name: living_wall_app
description: "Nauvra — Living Ambient Walls. Smart LED wall controller (Phase 1, local-first)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1
  # riverpod_annotation: ^2.3.5  # disabled — see dev_dependencies note on riverpod_generator

  # Routing
  go_router: ^14.2.0

  # Network
  dio: ^5.5.0
  web_socket_channel: ^3.0.1
  multicast_dns: ^0.3.2
  network_info_plus: ^6.0.0

  # Persistence
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Models / serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI
  google_fonts: ^6.2.1

  # Platform
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0

  # QR scan — onboarding/add-wall reads each unit's grid dims from a QR
  # code on the wall's label. mobile_scanner is the actively maintained
  # successor to the (deprecated) qr_code_scanner.
  mobile_scanner: ^5.0.0

  # App version for the About screen (dynamic, sourced from native build
  # rather than hardcoded in Dart so it can't drift from pubspec).
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.20.0
  # riverpod_generator pulls analyzer_plugin 0.12.0 (incompatible with analyzer 7).
  # Re-enable when upstream is fixed; until then write providers without @riverpod codegen.
  # riverpod_generator: ^2.4.2

  # Riverpod static checks (re-enable when analyzer_plugin is compatible with analyzer 7)
  # custom_lint: ^0.7.3
  # riverpod_lint: ^2.6.1

  # App icon generator — reads the NAUVRA source PNGs in icons/ and
  # writes iOS AppIcon.appiconset + Android mipmap-* assets. Run via
  # `dart run flutter_launcher_icons` whenever the source PNGs change.
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/scenes.json
    - assets/images/scenes/
    - assets/licenses/

# NAUVRA brand icon — sources live in assets/icon/ (pre-rasterized by the
# design team from the brand kit). Re-run the generator if any source
# PNG changes:
#
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/NAUVRA-Icon-iOS-1024.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/NAUVRA-Adaptive-Background-1024.png"
  adaptive_icon_foreground: "assets/icon/NAUVRA-Adaptive-Foreground-1024.png"
